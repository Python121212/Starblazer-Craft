name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'サイトを更新する（明示的に公開するときだけ選択）'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation renderer
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge mod and run Java tests
        run: gradle --no-daemon build
      - name: Verify compiled JAR contents
        run: python scripts/verify_jar.py
      - name: Resource tests
        run: python -m unittest discover -s tests -v
      - name: Validate assets and generate 3D preview
        run: python scripts/asset_catalog.py
      - name: Check viewer JavaScript syntax
        run: node --check tools/preview/viewer.js
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: asset-preview
          path: build/preview/
      - name: Test summary
        run: |
          echo '## 検査完了' >> "$GITHUB_STEP_SUMMARY"
          echo '- Java コンパイル・単体テスト・JSON 参照・PNG 整合性・JS 構文を検査しました。' >> "$GITHUB_STEP_SUMMARY"
          echo '- asset-preview を取得するか GitHub Pages で素材を確認できます。' >> "$GITHUB_STEP_SUMMARY"
          echo '- ゲーム起動・物理・描画・マルチの実機テストではありません。' >> "$GITHUB_STEP_SUMMARY"
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asset-preview
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
