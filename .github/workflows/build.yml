name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and reproducible JAR check
        run: python -m unittest discover -s tests -v
      - name: Validate assets and generate 3D preview
        run: python scripts/asset_catalog.py
      - name: Check viewer JavaScript syntax
        run: node --check tools/preview/viewer.js
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: asset-preview
          path: build/preview/
      - name: Test summary
        run: |
          echo '## 検査完了' >> "$GITHUB_STEP_SUMMARY"
          echo '- 単体テスト・JAR 再現性・JSON 参照・PNG 整合性・JS 構文を検査しました。' >> "$GITHUB_STEP_SUMMARY"
          echo '- asset-preview を取得するか GitHub Pages で素材を確認できます。' >> "$GITHUB_STEP_SUMMARY"
          echo '- ゲーム起動・物理・描画・マルチの実機テストではありません。' >> "$GITHUB_STEP_SUMMARY"
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asset-preview
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
