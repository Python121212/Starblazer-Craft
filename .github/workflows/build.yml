name: Build empty mod
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: starblazer-craft
          path: build/libs/*.jar
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.0.1 build/libs/*.jar --target "$GITHUB_SHA" --title "Starblazer Craft 0.0.1 — Forge 1.20.1" --notes "Minecraft 1.20.1 / Forge 47.x 用の空の MOD。機能追加なし。JAR 構造検査済み、ゲーム実起動は未検証。"
